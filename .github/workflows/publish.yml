# Changesets-driven release.
#
# Two phases, both of which run from this one workflow on every push to `main`:
#
#   1. Version. Pending `.changeset/*.md` files exist, so `changeset version`
#      drains them into version bumps + CHANGELOG entries and the changesets
#      action opens (or updates) the `changeset-release/main` PR. The next step
#      merges that PR automatically and re-dispatches this workflow.
#   2. Publish. No pending changesets remain, so `changeset publish` ships every
#      package whose version is not yet on npm, pushes the git tags, and creates
#      the GitHub releases.
#
# The file name is load-bearing: npm trusted publishing is configured per package
# against `.github/workflows/publish.yml`. Renaming this file breaks publishing
# for all 29 packages until every trusted-publisher entry is updated on npmjs.com.
name: Release

on:
  push:
    branches:
      - main
  # Also the re-entry point used by the auto-merge step below: `workflow_dispatch`
  # is the one event GITHUB_TOKEN is allowed to trigger, so it is how the publish
  # phase gets started after the bot merges the version PR.
  workflow_dispatch:

permissions: {}

# Never let two releases interleave. `cancel-in-progress: false` so a queued
# publish run waits for the version run instead of replacing it.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch, the release commit, and the tags
      pull-requests: write # open, update, and auto-merge the version PR
      id-token: write # mint the OIDC token npm trusted publishing authenticates with

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `changeset version` diffs against the base branch and the changelog
          # generator resolves commits to PRs, so shallow history is not enough.
          fetch-depth: 0
          # The action pushes the release commit and tags through the GitHub API
          # (`push-with-git-cli` defaults to false), so no on-disk credentials.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pnpm
        # Pin pnpm via `packageManager` in package.json (see ci.common.yml).
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version or publish
        id: changesets
        uses: changesets/action@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # setup-node sets NODE_AUTH_TOKEN to a placeholder ('XXXXX-XXXXX-XXXXX-XXXXX')
          # when no token exists, which prevents npm from falling back to OIDC
          # authentication. Setting it to an empty/undefined secret clears the
          # placeholder so trusted publishing can authenticate via the OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `changeset publish` builds the `pnpm publish` argv itself, so there is
          # no place to pass `--provenance`. This is the env var changesets
          # documents for it.
          NPM_CONFIG_PROVENANCE: true

      - name: Auto-merge the version PR
        if: steps.changesets.outputs.pr-number != ''
        id: automerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail

          # Prefer GitHub's native auto-merge — it honours branch protection and
          # merges once required checks pass. It is only available when the repo
          # has "Allow auto-merge" enabled, so fall back to merging outright. The
          # fallback is safe: the version PR's contents are generated verbatim
          # from changesets that already passed CI on `main`, and the packages
          # are built and validated again in the publish phase before anything
          # reaches npm.
          if ! gh pr merge "$PR" --squash --delete-branch --auto; then
            echo "Auto-merge unavailable; merging #$PR directly."
            gh pr merge "$PR" --squash --delete-branch
          fi

          # A merge performed on behalf of github-actions[bot] does not emit a
          # `push` event, so the publish phase will not start on its own. Wait
          # for the merge to land (native auto-merge is asynchronous), then
          # re-enter this workflow via `workflow_dispatch`.
          STATE=""
          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATE" = "MERGED" ]; then
            echo "Version PR #$PR merged; dispatching the publish run."
            gh workflow run publish.yml --ref main
          else
            echo "::notice::Version PR #$PR is still $STATE. It will publish once it merges and this workflow is dispatched (push to main, or run it manually)."
          fi

      - name: Summary
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          {
            echo "## Release summary"
            echo
            if [ -n "$PR_NUMBER" ]; then
              echo "Opened or updated version PR #${PR_NUMBER}."
            fi
            if [ "$PUBLISHED" = "true" ]; then
              echo "### Published"
              echo "$PUBLISHED_PACKAGES" | jq -r '.[] | "- \(.name)@\(.version)"'
            elif [ -z "$PR_NUMBER" ]; then
              echo "Nothing to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
